name: build to x64

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MinGW (Windows Compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile C Code for Windows
        run: |
          x86_64-w64-mingw32-gcc -Wall main.c -o calculator.exe

      - name: Upload calc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-windows-executable
          path: calculator.exe